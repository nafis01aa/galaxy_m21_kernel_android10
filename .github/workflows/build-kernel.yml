name: Build M21 Kernel with ReSukiSU

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev libtinfo5 libncurses5

      - name: Download Toolchains
        run: |
          mkdir -p toolchains
          
          # Clone exact GCC 4.9 for 64-bit
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android-10.0.0_r47 toolchains/gcc
          
          # Clone exact Clang version
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android-9.0.0_r61 toolchains/clang

      - name: Integrate ReSukiSU
        run: |
          rm -rf KernelSU drivers/kernelsu
          echo "==== Downloading and Integrating ReSukiSU ===="
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Build the Kernel
        run: |
          WORKSPACE=$(pwd)
          
          # Fix SELinux classmap.h error for newer host glibc
          echo "==== Patching SELinux classmap ===="
          sed -i 's/#if PF_MAX > 44/#if PF_MAX > 64/' security/selinux/include/classmap.h
          
          MAKE_ARGS="ARCH=arm64 \
            ANDROID_MAJOR_VERSION=q \
            CROSS_COMPILE=$WORKSPACE/toolchains/gcc/bin/aarch64-linux-android- \
            CC=$WORKSPACE/toolchains/clang/clang-4691093/bin/clang \
            CLANG_TRIPLE=$WORKSPACE/toolchains/clang/clang-4691093/bin/aarch64-linux-gnu- \
            HOSTCFLAGS=-fcommon"
          
          echo "==== Applying base defconfig ===="
          make $MAKE_ARGS exynos9610-m21dd_defconfig
          
          echo "==== Building Kernel ===="
          make $MAKE_ARGS -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: M21-ReSukiSU-Strict
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/exynos/exynos9610.dtb
